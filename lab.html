<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potion Academy: lab (dev)</title>
<style>
  :root { --bg: #1b1714; --ink: #f1e6d6; --muted: #b3a494; --card: #241e1a; --line: #3d332b; --accent: #f97316; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Nunito", system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-family: "Cinzel", Georgia, serif; font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 16px; font-size: 0.95rem; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  #stage { background: #2c3b34; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  #stage canvas { display: block; width: 100% !important; height: auto !important; image-rendering: pixelated; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .panel h2 { font-family: "Cinzel", Georgia, serif; font-size: 1rem; color: var(--accent); margin: 14px 0 6px; }
  .panel h2:first-child { margin-top: 0; }
  label { display: block; font-size: 0.9rem; margin: 6px 0; }
  select { width: 100%; font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px; margin-top: 4px; }
  .check { display: flex; gap: 8px; align-items: center; }
  ul { padding-left: 18px; margin: 6px 0; font-size: 0.88rem; color: var(--muted); }
  li { margin: 3px 0; }
  kbd { background: rgba(249,115,22,0.15); border-radius: 3px; padding: 0 4px; color: var(--ink); }
  #status { font-weight: 700; color: var(--ink); }
  .tip { color: var(--muted); font-size: 0.85rem; margin-top: 16px; }
  input[type=range] { width: 100%; margin-top: 4px; accent-color: var(--accent); }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  nav a { color: var(--ink); text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 0.9rem; }
  nav a.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Lab · <span id="lab-title"></span></h1>
  <p class="lead">Ferramenta de desenvolvimento, só para testar ideias do jogo antes de entrarem nele. Não entra no build de produção. Experimentos em <code>src/lab/experiments/</code>, registrados em <code>src/lab/registry.ts</code>.</p>
  <nav id="lab-nav" aria-label="Experimentos"></nav>
  <p class="lead" id="lab-summary"></p>

  <div class="layout">
    <div id="stage"></div>
    <aside class="panel" id="lab-panel"></aside>
  </div>
</main>
<script type="module" src="/src/lab/main.ts"></script>
</body>
</html>

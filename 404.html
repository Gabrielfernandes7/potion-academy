<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potion Academy: página não encontrada</title>
<meta name="description" content="Esta página não está no manuscrito do alquimista.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #0d1714; --paper: #161a18; --line: #5b4d36; --gold: #d9a441; --gold-bright: #f0c674; --text: #e8dcc0; --muted: #bfae8a; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: Nunito, system-ui, sans-serif; }
  main { max-width: 460px; text-align: center; border: 3px solid var(--line); border-radius: 12px; padding: 28px 24px; background: var(--paper); }
  .codigo { font-family: Cinzel, Georgia, serif; color: var(--gold); font-size: 3.5rem; margin: 0; letter-spacing: 0.08em; }
  h1 { font-family: Cinzel, Georgia, serif; color: var(--gold-bright); font-size: 1.4rem; margin: 8px 0 12px; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 20px; }
  a { display: inline-block; color: #1a1206; background: var(--gold); text-decoration: none; font-weight: 700; padding: 10px 18px; border-radius: 8px; }
  a:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="codigo">404</p>
  <h1>Esta página não está no manuscrito</h1>
  <p>O endereço que você abriu não existe. Talvez a página tenha mudado de lugar, ou a Roo ainda não a encontrou.</p>
  <a href="/">Voltar ao jogo</a>
</main>
</body>
</html>
